name: Docker CI

on:
  push:
    branches:
      - main
      - synthetic_data_pipeline
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: "Additional image tag, for example packagecompile-20260604-amd64"
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: epi-sim
  IMAGE_NAME: episim.jl

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build images
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' }}

      - name: Build runtime image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: episim-runtime
          load: true
          tags: episim-runtime:ci
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=episim-jl
          cache-to: type=gha,mode=max,scope=episim-jl
          build-args: |
            SHOULD_COMPILE=true
            OCI_REVISION=${{ github.sha }}
            OCI_VERSION=${{ steps.meta.outputs.version }}

      - name: Save runtime image
        run: docker save episim-runtime:ci -o /tmp/episim-runtime.tar

      - name: Upload runtime image
        uses: actions/upload-artifact@v4
        with:
          name: episim-runtime-image
          path: /tmp/episim-runtime.tar
          retention-days: 1

      - name: Build test image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: episim-test
          load: true
          tags: episim-test:ci
          cache-from: |
            type=gha,scope=episim-jl
            type=gha,scope=episim-jl-test
          cache-to: type=gha,mode=max,scope=episim-jl-test
          build-args: |
            SHOULD_COMPILE=true
            OCI_REVISION=${{ github.sha }}

      - name: Save test image
        run: docker save episim-test:ci -o /tmp/episim-test.tar

      - name: Upload test image
        uses: actions/upload-artifact@v4
        with:
          name: episim-test-image
          path: /tmp/episim-test.tar
          retention-days: 1

  test:
    name: Run test suite
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read

    steps:
      - name: Download test image
        uses: actions/download-artifact@v4
        with:
          name: episim-test-image
          path: /tmp

      - name: Load test image
        run: docker load -i /tmp/episim-test.tar

      - name: Run Python code quality checks
        run: |
          docker run --rm episim-test:ci \
            bash -lc "cd /opt/episim/python && ruff check . && ruff format --check ."

      - name: Run Python tests
        run: |
          docker run --rm episim-test:ci \
            bash -lc "cd /opt/episim/python && pytest tests/ -v"

      - name: Run Julia tests
        run: docker run --rm episim-test:ci julia --project=/opt/episim /opt/episim/test/runtests.jl

  publish:
    name: Publish image
    runs-on: ubuntu-latest
    needs: test
    if: ${{ github.event_name != 'pull_request' }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download runtime image
        uses: actions/download-artifact@v4
        with:
          name: episim-runtime-image
          path: /tmp

      - name: Load runtime image
        run: docker load -i /tmp/episim-runtime.tar

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PUSH_TOKEN || github.token }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' }}

      - name: Tag and push runtime image
        run: |
          echo "${{ steps.meta.outputs.tags }}" | while read -r tag; do
            if [ -n "$tag" ]; then
              docker tag episim-runtime:ci "$tag"
              docker push "$tag"
            fi
          done

      - name: Job summary
        run: |
          {
            echo "## Docker image"
            echo
            echo "Published to \`${REGISTRY}/${IMAGE_OWNER}/${IMAGE_NAME}\`."
            echo
            echo "### Tags"
            echo "${{ steps.meta.outputs.tags }}" | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"
