name: CI

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ '**' ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-test-image:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build episim-test image
      run: |
        docker build \
          --target episim-test \
          --build-arg SHOULD_COMPILE=true \
          --build-arg OCI_REVISION=${{ github.sha }} \
          -t episim-test .
        docker save episim-test > /tmp/episim-test.tar

    - name: Upload Docker image
      uses: actions/upload-artifact@v4
      with:
        name: episim-test-image
        path: /tmp/episim-test.tar

  python-tests:
    runs-on: ubuntu-latest
    needs: build-test-image
    steps:
    - name: Download Docker image
      uses: actions/download-artifact@v4
      with:
        name: episim-test-image
        path: /tmp

    - name: Load Docker image
      run: docker load < /tmp/episim-test.tar

    - name: Run Python code quality checks
      run: |
        docker run --rm episim-test \
          bash -lc "cd /opt/episim/python && ruff check . && ruff format --check ."

    - name: Run Python tests
      run: |
        docker run --rm episim-test \
          bash -lc "cd /opt/episim/python && pytest tests/ -v"

  julia-tests:
    runs-on: ubuntu-latest
    needs: build-test-image
    steps:
    - name: Download Docker image
      uses: actions/download-artifact@v4
      with:
        name: episim-test-image
        path: /tmp

    - name: Load Docker image
      run: docker load < /tmp/episim-test.tar

    - name: Run Julia tests
      run: docker run --rm episim-test julia --project=/opt/episim /opt/episim/test/runtests.jl

  docker-publish:
    runs-on: ubuntu-latest
    needs: [python-tests, julia-tests]
    if: success() && github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install cosign
      uses: sigstore/cosign-installer@v3
      with:
        cosign-release: 'v2.2.4'

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log into registry ${{ env.REGISTRY }}
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=tag
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push runtime image
      id: build-and-push
      uses: docker/build-push-action@v5
      with:
        context: .
        target: episim-runtime
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: linux/amd64
        build-args: |
          SHOULD_COMPILE=true
          OCI_REVISION=${{ github.sha }}
          OCI_VERSION=${{ steps.meta.outputs.version }}

    - name: Sign the published Docker image
      env:
        TAGS: ${{ steps.meta.outputs.tags }}
        DIGEST: ${{ steps.build-and-push.outputs.digest }}
      run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}
