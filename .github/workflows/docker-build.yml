name: Build Docker Image

on:
  push:
    branches:
      - main
      - synthetic_data_pipeline
  workflow_dispatch:
    inputs:
      tag:
        description: "Additional image tag, for example packagecompile-20260604-amd64"
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: epi-sim
  IMAGE_NAME: episim.jl

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and publish image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PUSH_TOKEN || github.token }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' }}

      - name: Build and push runtime image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: episim-runtime
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=episim-jl
          cache-to: type=gha,mode=max,scope=episim-jl
          build-args: |
            SHOULD_COMPILE=true
            OCI_REVISION=${{ github.sha }}
            OCI_VERSION=${{ steps.meta.outputs.version }}

      - name: Job summary
        run: |
          {
            echo "## Docker image"
            echo
            echo "Published to \`${REGISTRY}/${IMAGE_OWNER}/${IMAGE_NAME}\`."
            echo
            echo "### Tags"
            echo "${{ steps.meta.outputs.tags }}" | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"
